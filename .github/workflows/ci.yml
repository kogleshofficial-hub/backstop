name: Backstop CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Fail on high or critical dependency advisories
        run: npm audit --audit-level=high
      - run: npm test
      - run: npm run check
      - run: npm run build
